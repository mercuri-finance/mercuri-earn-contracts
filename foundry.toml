[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Only the explicit remappings.txt.
auto_detect_remappings = false
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 44444444
via_ir = true
bytecode_hash = "none"
# Runtime verification resolves immutable reference IDs against the matching source AST.
ast = true
additional_compiler_profiles = [
    { name = "small", via_ir = true, optimizer_runs = 200 },
]
compilation_restrictions = [
    # The Earn contracts and their deployment scripts build with 200 runs (the `small` profile).
    { paths = "src/**", optimizer_runs = 200 },
    { paths = "script/**", optimizer_runs = 200 },
]
fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "./deployments" }, { access = "read-write", path = "./test-export" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 64
depth = 64
# Unexpected handler reverts (including failed assertions) must fail everyday checks.
fail_on_revert = true

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"

[fmt]
line_length = 120
